services:
  backend:
    image: node:22-alpine
    container_name: aevum-payguard-backend
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "3001:3001"
    command: sh -c "npm ci && npm run build:sdk && npm run dev:backend"
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: aevum-payguard-frontend
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm run dev:frontend"
    restart: unless-stopped

